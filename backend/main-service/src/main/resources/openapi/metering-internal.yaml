openapi: 3.0.3
info:
  title: Main Service Internal API — Metering Module
  version: 1.0.0
  description: |
    metering 模块内部接口。
    允许调用方：device-service（IoT 读数推送）。
    其余模块间调用（如 occupancy 触发锚点读数采集）一律通过 metering/api 下的
    Port Interface 完成，不走 HTTP。
servers:
  - url: /internal/v1
tags:
  - name: InternalMetering
    description: device-service 读数推送

paths:

  /metering/readings/iot-push:
    post:
      tags: [InternalMetering]
      operationId: pushIotReading
      summary: Device Service 推送 IoT 水电读数
      description: |
        由 Device Service 采集到读数后推送。
        幂等键：(deviceIdRaw + readingTime)，重复推送返回 200 不重复入库。
        仅接受 PERIODIC 类型读数，CHECK_IN / CHECK_OUT 锚点读数由 occupancy 模块内部触发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IotReadingPushRequest'
      responses:
        '200':
          description: 处理成功（含幂等重复推送）
        '400':
          description: 参数错误 / 房间无活跃绑定

components:
  schemas:

    IotReadingPushRequest:
      type: object
      required: [deviceIdRaw, roomId, meterType, readingValue, readingTime]
      properties:
        deviceIdRaw:
          type: string
          description: IoT 设备原始标识（幂等键之一）
        roomId:
          type: integer
          format: int64
          description: 房间 ID（device-service 已解析绑定关系）
        meterType:
          type: string
          enum: [WATER, ELECTRICITY, HOT_WATER]
        readingValue:
          type: number
          format: double
          description: 表盘累计读数（非增量）
        readingTime:
          type: string
          format: date-time
