openapi: 3.0.3
info:
  title: Main Service Internal API - Account Module
  description: |
    account 模块内部接口契约（不经 Gateway，服务间/模块间直接调用）。

    安全规则：
    - 需要有效 Service JWT（X-Service-Token）
    - 无 x-required-permission
    - 允许调用方：billing-service（充值回调）、main-service 内部模块
  version: 1.0.0

servers:
  - url: /internal/v1
    description: 内部接口根路径

tags:
  - name: internal-account
    description: 账户内部操作（充值回调）

paths:

  /account/top-up-callback:
    post:
      tags: [ internal-account ]
      operationId: topUpCallback
      summary: 充值账单支付成功回调
      description: |
        由 Billing Service 在充值账单支付完成后调用。
        执行实际余额增加，写账户流水。
        接口幂等：同一 billId 重复调用返回 200，不重复记账。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpCallbackRequest'
      responses:
        '200':
          description: 处理成功（含幂等重复调用）
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: '../../../../../common/src/main/resources/openapi/common-components.yaml#/components/schemas/ErrorResponse'
        '404':
          description: 账户不存在
          content:
            application/json:
              schema:
                $ref: '../../../../../common/src/main/resources/openapi/common-components.yaml#/components/schemas/ErrorResponse'

components:
  schemas:

    TopUpCallbackRequest:
      type: object
      required:
        - billId
        - accountId
        - amount
        - paidAt
      properties:
        billId:
          type: integer
          format: int64
          description: Billing Service 充值账单 ID（幂等键）
        accountId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
          description: 实际支付金额（元）
        paidAt:
          type: string
          format: date-time
          description: 支付完成时间
